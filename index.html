<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>duonthn / Dekisugi</title>
<meta name="description" content="I'm Thien and live in HCMC">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #16213b;
    --text: #f2f5fb;
    --muted: #9aa7c4;
    --line: rgba(255, 255, 255, .12);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid;
    place-items: center;
    padding: 24px;
  }
  main { text-align: center; max-width: 420px; }
  .avatar {
    width: 112px; height: 112px;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    margin: 0 auto 24px;
    background: var(--line);
    animation: rise .7s ease-out both;
  }
  h1 { font-size: 2rem; font-weight: 600; letter-spacing: -.01em; }
  p { margin-top: 8px; color: var(--muted); font-size: 1.05rem; }
  nav {
    margin-top: 32px;
    display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
  }
  nav a {
    width: 44px; height: 44px;
    display: grid; place-items: center;
    border-radius: 50%;
    border: 1px solid var(--line);
    transition: background .2s, transform .2s;
  }
  nav a:hover, nav a:focus-visible { background: var(--line); transform: translateY(-2px); outline: none; }
  nav a:focus-visible { box-shadow: 0 0 0 2px var(--text); }
  nav img { width: 20px; height: 20px; display: block; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .avatar { animation: none; } nav a { transition: none; } }
</style>
</head>
<body>
<main>
  <!-- Đặt ảnh đại diện tên avatar.png cùng thư mục với index.html -->
  <img class="avatar" src="avatar.png" alt="Ảnh đại diện của duonthn">
  <h1>duonthn / Dekisugi</h1>
  <p>I'm Thien and live in HCMC</p>

    <a href="https://www.youtube.com/@duonthn" aria-label="YouTube"><img src="https://cdn.simpleicons.org/youtube/white" alt=""></a>
    <a href="https://www.facebook.com/duonthn" aria-label="Facebook"><img src="https://cdn.simpleicons.org/facebook/white" alt=""></a>
    <a href="https://discord.com/users/YOUR_ID" aria-label="Discord"><img src="https://cdn.simpleicons.org/discord/white" alt=""></a>
    <a href="https://x.com/duonthn" aria-label="X"><img src="https://cdn.simpleicons.org/x/white" alt=""></a>

    <a href="https://osu.ppy.sh/users/YOUR_ID" aria-label="osu!"><img src="https://cdn.simpleicons.org/osu/white" alt=""></a>
